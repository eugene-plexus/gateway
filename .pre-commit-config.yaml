# Pre-commit hooks — mirror the CI lint/format gate so unformatted or
# unlinted code never reaches CI (the cause of the chronic CI-red runs).
#
# One-time setup per clone:
#   pip install pre-commit && pre-commit install
#
# After that, `git commit` auto-runs ruff (lint --fix) + ruff-format on
# staged Python files. If a hook modifies files, re-stage and commit again.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # Fast checks that CI also runs, each well under a second (W0.6). CI's
  # "Codegen freshness" job regenerates from the pinned specs over the network,
  # so only its offline half runs here: the generated code must record SPECS_REF.
  - repo: local
    hooks:
      - id: vendored-platform
        name: vendored platform integrity
        entry: python scripts/check-vendored.py
        language: python
        pass_filenames: false
        always_run: true
      - id: specs-ref-stamp
        name: generated code records SPECS_REF
        entry: python scripts/check-specs-ref.py
        language: python
        pass_filenames: false
        always_run: true
